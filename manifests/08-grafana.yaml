# Grafana -- portfolio-minimal deployment.
#
# Single replica, ephemeral storage, no auto-provisioning: docs/verification.md
# walks through adding the Prometheus datasource and importing
# dashboards/red-metrics.json by hand, which is more instructive for a demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          env:
            # Demo only -- mount a Secret (GF_SECURITY_ADMIN_PASSWORD__FILE)
            # in anything beyond a throwaway cluster.
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          ports:
            - name: web
              containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      protocol: TCP
